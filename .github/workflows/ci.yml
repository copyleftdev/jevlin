name: Jevlin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build check -Doptimize=${{ matrix.optimize }}
      - run: python3 scripts/compile_fail.py "$(command -v zig)"
      - name: Verify TLS certificates and allocation recovery
        run: python3 scripts/tls.py --optimize=${{ matrix.optimize }} --report tls-report.json
      - name: Upload TLS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-${{ matrix.optimize }}
          path: tls-report.json
          if-no-files-found: warn
