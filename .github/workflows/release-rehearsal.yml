name: Jevlin release rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check release source
        run: zig build check -Doptimize=ReleaseSafe
      - name: Build reproducible archive and verify consumers
        run: python scripts/release.py
      - name: Preserve rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal-${{ github.sha }}
          path: release-dist/
          if-no-files-found: warn
          retention-days: 30
